<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 ➔ Mega2560 平衡車 PID 即時波形與控制台</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 50% -20%, #0e2a47 0%, #0a1726 50%, #030712 100%);
      --card: rgba(15, 23, 42, 0.75);
      --border: rgba(56, 189, 248, 0.18);
      --accent: #38bdf8;
      --red: #f43f5e;
      --green: #10b981;
      --text: #f8fafc;
      --sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text); 
      min-height: 100vh; 
      padding: 20px 16px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    .header { text-align: center; margin-bottom: 18px; }
    .header h1 { 
      font-size: 1.45rem; 
      font-weight: 800; 
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #34d399 100%); 
      -webkit-background-clip: text; 
      background-clip: text;
      -webkit-text-fill-color: transparent; 
    }
    .status-badge { 
      display: inline-block; 
      padding: 5px 16px; 
      border-radius: 20px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      margin-top: 6px; 
      background: rgba(56, 189, 248, 0.1); 
      color: var(--accent); 
      border: 1px solid var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .grid { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
    .card { 
      background: var(--card); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); 
      border-radius: 18px; 
      padding: 18px; 
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.08); 
      transition: border-color 0.3s ease;
    }
    .card:hover { border-color: rgba(56, 189, 248, 0.4); }
    .card-title { font-size: 0.95rem; color: var(--sub); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
    
    .chart-container { position: relative; width: 100%; height: 180px; background: #070d19; border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; box-shadow: inset 0 2px 8px rgba(0,0,0,0.6); }
    canvas { width: 100%; height: 100%; display: block; }
    .chart-legend { display: flex; justify-content: space-around; margin-top: 10px; font-size: 0.78rem; font-weight: 600; }
    .leg-item { display: flex; align-items: center; gap: 6px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }

    .control-group { margin-bottom: 14px; }
    .control-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
    .val { font-weight: 700; color: var(--accent); font-family: monospace; font-size: 0.95rem; }
    input[type=range] { width: 100%; height: 8px; border-radius: 4px; background: #1e293b; outline: none; -webkit-appearance: none; appearance: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent); }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { padding: 13px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; color: white; transition: transform 0.1s, box-shadow 0.2s; }
    button:active { transform: scale(0.96); }
    .btn-start { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
    .btn-stop { background: linear-gradient(135deg, #e11d48, #f43f5e); box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3); }
    .btn-query { background: linear-gradient(135deg, #0284c7, #38bdf8); grid-column: span 2; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3); }
  </style>
</head>
<body>
  <div class="header">
    <h1>ESP32 ➔ Mega2560 平衡車控制台</h1>
    <div id="btStatus" class="status-badge">藍芽連線檢查中...</div>
  </div>

  <div class="grid">
    <!-- 即時 PID 姿態動態波形圖表 -->
    <div class="card">
      <div class="card-title">
        <span>即時 PID 姿態動態波形 (Real-Time Chart)</span>
        <span id="liveVals" style="font-size:0.8rem; color:var(--accent);">Angle: 0.0°</span>
      </div>
      <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
      </div>
      <div class="chart-legend">
        <div class="leg-item"><span class="leg-dot" style="background:#ef4444;"></span> 即時傾角 (Angle)</div>
        <div class="leg-item"><span class="leg-dot" style="background:#38bdf8;"></span> 目標角度 (Target)</div>
        <div class="leg-item"><span class="leg-dot" style="background:#22c55e;"></span> 馬達 PWM 輸出</div>
      </div>
    </div>

    <!-- PID 滑桿調參 -->
    <div class="card">
      <div class="card-title">無線 PID 即時調參 (Slider Controls)</div>

      <div class="control-group">
        <div class="control-label"><span>Kp (比例增益)</span><span id="kpDisp" class="val">20.0</span></div>
        <input type="range" min="0" max="100" step="1" value="20" onchange="sendCmd('P' + this.value); document.getElementById('kpDisp').innerText = this.value;">
      </div>

      <div class="control-group">
        <div class="control-label"><span>Kd (微分阻尼)</span><span id="kdDisp" class="val">0.5</span></div>
        <input type="range" min="0" max="10" step="0.1" value="0.5" onchange="sendCmd('D' + this.value); document.getElementById('kdDisp').innerText = this.value;">
      </div>

      <div class="control-group">
        <div class="control-label"><span>Ki (積分增益)</span><span id="kiDisp" class="val">0.0</span></div>
        <input type="range" min="0" max="5" step="0.1" value="0" onchange="sendCmd('I' + this.value); document.getElementById('kiDisp').innerText = this.value;">
      </div>

      <div class="control-group">
        <div class="control-label"><span>Target Angle (目標角度)</span><span id="targetDisp" class="val">23.0°</span></div>
        <input type="range" min="0" max="45" step="0.2" value="23" onchange="sendCmd('T' + this.value); document.getElementById('targetDisp').innerText = this.value + '°';">
      </div>
    </div>

    <!-- 操控按鈕 -->
    <div class="card">
      <div class="btn-grid">
        <button class="btn-start" onclick="sendCmd('1')">啟動平衡 (1)</button>
        <button class="btn-stop" onclick="sendCmd('0')">緊急停止 (0)</button>
        <button class="btn-query" onclick="sendCmd('?')">查詢目前所有參數 (?)</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');

    const MAX_POINTS = 50;
    let angleData = new Array(MAX_POINTS).fill(23.0);
    let targetData = new Array(MAX_POINTS).fill(23.0);
    let motorData = new Array(MAX_POINTS).fill(0);

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawChart() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // 背景網格
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let y = 0; y < h; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      const centerY = h / 2;
      const angleScale = 4.0;
      const motorScale = 0.5;

      // Target Angle Line
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      for (let i = 0; i < MAX_POINTS; i++) {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = centerY - (targetData[i] - 23.0) * angleScale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // Motor PWM Line
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < MAX_POINTS; i++) {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = centerY - motorData[i] * motorScale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Current Angle Line
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i < MAX_POINTS; i++) {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = centerY - (angleData[i] - 23.0) * angleScale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function sendCmd(cmd) {
      if (location.protocol === 'file:') {
        console.log('[Mock Send Cmd]:', cmd);
        return;
      }
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1000);
      fetch(`/api/send?cmd=${encodeURIComponent(cmd)}`, { signal: controller.signal })
        .finally(() => clearTimeout(timeoutId));
    }

    let isPolling = false;
    function pollStatus() {
      if (isPolling) return;
      isPolling = true;

      // 本地瀏覽器直接開啟 (file://) 模式下，模擬實時波形數據
      if (location.protocol === 'file:') {
        const badge = document.getElementById('btStatus');
        badge.innerText = "💻 本地預覽模式 (模擬波形數據中)";
        badge.style.borderColor = "#38bdf8";
        badge.style.color = "#38bdf8";

        const mockAngle = 23.0 + (Math.sin(Date.now() / 400) * 2.5) + (Math.random() - 0.5) * 0.4;
        const mockMotor = Math.floor(Math.sin(Date.now() / 300) * 120 + (Math.random() - 0.5) * 20);

        angleData.push(mockAngle); angleData.shift();
        targetData.push(23.0); targetData.shift();
        motorData.push(mockMotor); motorData.shift();

        document.getElementById('liveVals').innerText = `Angle: ${mockAngle.toFixed(1)}° | PWM: ${mockMotor}`;
        requestAnimationFrame(drawChart);
        isPolling = false;
        return;
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1000);

      fetch('/api/status', { signal: controller.signal })
        .then(res => res.json())
        .then(data => {
          const badge = document.getElementById('btStatus');
          if (data.connected) {
            badge.innerText = "藍芽連線成功 (98:D3:31:F4:20:B8)";
            badge.style.borderColor = "#22c55e";
            badge.style.color = "#22c55e";
          } else {
            badge.innerText = "藍芽連線中...";
            badge.style.borderColor = "#f59e0b";
            badge.style.color = "#f59e0b";
          }

          if (data.angle !== undefined) {
            angleData.push(data.angle); angleData.shift();
            targetData.push(data.target); targetData.shift();
            motorData.push(data.motor); motorData.shift();

            document.getElementById('liveVals').innerText = `Angle: ${data.angle.toFixed(1)}° | PWM: ${data.motor}`;
            requestAnimationFrame(drawChart);
          }
        })
        .catch(err => {})
        .finally(() => {
          clearTimeout(timeoutId);
          isPolling = false;
        });
    }

    setInterval(pollStatus, 250);
    drawChart();
  </script>
</body>
</html>
